<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d0d0d" />
    <!-- The site has its own dark theme, so the Dark Reader extension shouldn't re-darken the
         light one (it turns the page olive and the photo stack purple). -->
    <meta name="darkreader-lock" />
    <script>
      // Before first paint, so a visitor who picked light doesn't see a dark flash. Keep the key
      // and color in sync with src/lib/theme.ts.
      try {
        if (localStorage.getItem('theme') === 'light') {
          document.documentElement.classList.remove('dark')
          document.querySelector('meta[name="theme-color"]').content = '#f7f4ee'
        }
      } catch {}
    </script>
    <script>
      // Every page needs /api/site, and it names the home page's largest image (the headshot):
      // request both now instead of after the app's JavaScript has loaded. The app takes over the
      // response in src/api/queries.ts (adoptEarlySite).
      window.__site = fetch('/api/site', { headers: { Accept: 'application/json' } }).then((response) => {
        if (!response.ok) throw new Error(`GET /api/site: ${response.status}`)
        return response.json()
      })
      // The app handles a failure (it fetches again); this only keeps it out of the console.
      window.__site.catch(() => {})
      if (location.pathname === '/') {
        window.__site.then((site) => {
          const headshot = site.profile && site.profile.headshot
          if (!headshot) return
          const link = document.createElement('link')
          link.rel = 'preload'
          link.as = 'image'
          link.href = headshot
          link.fetchPriority = 'high'
          document.head.append(link)
        }, () => {})
      }
    </script>
    <meta name="description" content="Daniel Reyes, software engineer: projects, resume, and contact." />
    <title>Daniel Reyes</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
