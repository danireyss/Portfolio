name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time; a newer push waits instead of cancelling a deploy halfway through.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to AWS
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lets the job request a GitHub OIDC token to assume the AWS deploy role (no stored keys).
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            auth/package-lock.json
            infra/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      # cargo-lambda cross-compiles to Lambda's arm64 Linux using Zig as the linker.
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-lambda

      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build

      - name: Build backend for Lambda (arm64)
        working-directory: backend
        run: cargo lambda build --release --arm64

      # CDK bundles the auth service with esbuild during synth, from its node_modules.
      - name: Install auth service dependencies
        working-directory: auth
        run: npm ci

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          # The DeployRoleArn output of the PortfolioGithubOidc stack (Settings -> Variables).
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Deploy PortfolioStack
        working-directory: infra
        run: npm ci && npx cdk deploy PortfolioStack --require-approval never
