# Photo galleries, shown on /photos with Amicro's Time Machine stack, one stack per gallery.
# A gallery's photos are whatever images are in photos/<folder>/ in the S3 media bucket: the
# backend lists the folder when the page loads, so adding photos only takes an upload (the S3
# console, `aws s3 cp`, or `make upload-photos`), not a redeploy. In development they're read
# from frontend/public/photos/<folder>/ (gitignored). Photos show in file-name order, so name
# them 01.jpg, 02.jpg, ... A gallery with no photos yet is hidden, and so is the nav link until
# one has photos.
#
# Details per photo are optional, keyed by file name:
#   [galleries.photos."01.jpg"]
#   alt = "What's in the photo, for screen readers"   # default: "<title>, photo 1"
#   caption = "Shown under the stack"
#   date = "Jun 2026"                                  # label on the timeline scrubber

[[galleries]]
folder = "stealth-startup"
title = "Stealth Start-Up (AI Company)"
description = "Software Engineer Intern · Summer 2026"

[[galleries]]
folder = "global-empowerment-mission"
title = "Global Empowerment Mission"
description = "Full-Stack Software Engineer Intern · May 2026"
