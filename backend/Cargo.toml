[package]
name = "portfolio-api"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.92"
aws-config = { version = "1.12.0", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1.146.1"
aws-sdk-sesv2 = "1.133.0"
axum = "0.8.9"
bytes = "1.12.1"
futures = { version = "0.3", default-features = false, features = ["std"] }
include_dir = "0.7.4"
lambda_http = "1.3.1"
opentelemetry = { version = "0.32", features = ["trace", "metrics", "logs"] }
opentelemetry-appender-tracing = "0.32"
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["http-proto", "reqwest-blocking-client", "trace", "metrics", "logs"] }
opentelemetry_sdk = { version = "0.32", features = ["trace", "metrics", "logs"] }
pulldown-cmark = "0.13.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
toml = "1.1.6"
tower-http = { version = "0.7.1", features = ["trace"] }
tracing = "0.1.44"
tracing-opentelemetry = "0.33"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
ts-rs = "12.0.1"

[dev-dependencies]
http-body-util = "0.1.5"
pprof = { version = "0.15.0", features = ["flamegraph"] }
tower = { version = "0.5.3", features = ["util"] }

# Release optimizations plus debug info, so profiles (`make flamegraph`) show function names.
[profile.profiling]
inherits = "release"
debug = true
